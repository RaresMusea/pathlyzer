services:
  nextjs:
    build:
      context: core/
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    image: raresmusea/pathlyzer:latest
    env_file:
      - .env
    depends_on:
      - db
  
  db:
    image: postgres:latest
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes: 
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
